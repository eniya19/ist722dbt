version: 2

sources:
  - name: stackoverflow
    database: stackoverflow
    schema: public

    tables:
      - name: posts
        description: Table containing the posts data
        columns:
          - name: post_id
            description: Unique identifier for each post.    

      - name: users
        description: Table containing user data.
        columns:
          - name: user_id
            description: Unique identifier for each user.

      - name: tags
        description: Table containing tag data for posts.
        columns:
          - name: tag_id
            description: Unique identifier for each tag.
            
